name: Validate Skills

on:
  push:
    paths:
      - 'skills/**'
      - 'tools/**'
      - 'docs/**'
      - '.mise.toml'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'skills/**'
      - 'tools/**'
      - 'docs/**'
      - '.mise.toml'
      - 'package.json'
      - 'bun.lock'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - run: bun install
      - run: bun tools/cli.ts check